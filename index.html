    <title>QuickPost: Smart eCommerce Shipping &amp; Courier Aggregator</title>
    <!-- Dark mode applies only inside the signed-in panel. Set it before the first paint so a reload does not flash white. -->
    <script>
      (function () {
        try {
          var p = location.pathname;
          if (!/^[/]((cargo)[/])?(admin|user|internal-crm)([/]|$)/.test(p) || p.indexOf('/user/book-session') === 0) return;
          var t = localStorage.getItem('qp_theme');
          if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="QuickPost is a smart shipping platform for online sellers, marketplace stores and growing brands in India. Compare courier rates, ship with the best courier for every pincode, automate COD remittance, reduce RTO and track every parcel — all from one dashboard.">
