<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>DigiLocker</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f8fafc; color: #0f172a; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; box-sizing: border-box; }
    .card { max-width: 380px; text-align: center; background: #fff; border-radius: 16px; padding: 28px 24px; box-shadow: 0 10px 30px -12px rgba(15, 23, 42, 0.25); }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { font-size: 14px; color: #475569; margin: 0; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="card">
    <h1>DigiLocker step finished</h1>
    <p>You can close this window and go back to the KYC page. Your Aadhaar is checked there automatically.</p>
  </div>
  <script>
    // Opened from the KYC page: tell it to check now, then close this window.
    try {
      if (window.opener && !window.opener.closed) {
        window.opener.postMessage({ type: "digilocker-return" }, window.location.origin);
        setTimeout(function () { window.close(); }, 300);
      }
    } catch (e) { /* the message above still tells the person what to do */ }
  </script>
</body>
</html>
